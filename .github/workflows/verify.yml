name: Verify reproduction package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source, hashes and release hygiene
        run: python scripts/verify_repo.py
      - name: Benchmark protocol tests
        run: python -m unittest discover -s benchmarks/tests -v
      - name: Flat model metadata and runtime layout tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Figure 3 coverage and integrity tests
        # CPU-only CI skips the two tests requiring PyTorch. Both passed in GPU-server validation.
        run: python -m unittest discover -s findings/figure3/tests -v
      - name: Figure 9 sample coverage and plotting tests
        run: |
          python -m pip install -r findings/requirements-plot.txt
          python -m unittest discover -s findings/figure9/tests -v
